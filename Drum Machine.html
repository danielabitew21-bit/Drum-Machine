<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drum Machine</title>

   <link href="drum-machine.css" rel="stylesheet">

</head>

<body>

    <div id="drum-machine">

        <!--=========================
            LEFT SIDE (DRUM PADS)
        ==========================-->

        <div id="pad-bank">

            <button class="drum-pad" id="Q" data-name="Heater 1">
                Q
                <audio
                    class="clip"
                    id="Q"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="W" data-name="Heater 2">
                W
                <audio
                    class="clip"
                    id="W"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="E" data-name="Heater 3">
                E
                <audio
                    class="clip"
                    id="E"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3">
                </audio>
            </button>
            <br>

            <button class="drum-pad" id="A" data-name="Heater 4">
                A
                <audio
                    class="clip"
                    id="A"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="S" data-name="Clap">
                S
                <audio
                    class="clip"
                    id="S"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="D" data-name="Open-HH">
                D
                <audio
                    class="clip"
                    id="D"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3">
                </audio>
            </button>
            <br>
            <button class="drum-pad" id="Z" data-name="Kick-n'-Hat">
                Z
                <audio
                    class="clip"
                    id="Z"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="X" data-name="Kick">
                X
                <audio
                    class="clip"
                    id="X"
                    src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3">
                </audio>
            </button>

            <button class="drum-pad" id="C" data-name="Closed-HH">
                C
                <audio
                    class="clip"
                    id="C"
                    src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3">
                </audio>
            </button>

        </div>

        <!--=========================
            RIGHT SIDE (CONTROLS)
        ==========================-->

        <div id="controls">

            <!-- Power -->

            <div class="control-row">

                <span>Power</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="power"
                        checked>

                    <span class="slider"></span>

                </label>

            </div>

            <!-- Display -->

            <div id="display">

                Ready

            </div>

            <!-- Volume -->

            <div class="volume-control">

                <label for="volume">

                    Volume

                </label>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5">

            </div>

            <!-- Bank -->

            <div class="control-row">

                <span id="bank-name">

                    Heater Kit

                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="bank">

                    <span class="slider"></span>

                </label>

            </div>
<p id="display"></p>
        </div>

    </div>

    <script src="drum-machine.js"></script>

</body>

</html>
